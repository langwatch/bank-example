[project]
name = "bank-customer-support"
version = "0.1.0"
description = "Bank Customer Support Agent with Scenario Testing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno>=1.6.4",
    "langwatch>=0.2.4",
    "langwatch-scenario @ ../../python",
    "openinference-instrumentation-agno>=0.1.6",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.2.0",
    "pytest-timeout>=2.4.0",
    "python-dotenv>=1.1.0",
]

[tool.pytest.ini_options]
timeout = 300
